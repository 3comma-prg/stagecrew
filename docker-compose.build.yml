# PC 上でソースからビルドして試すとき用
# docker compose -f docker-compose.build.yml up --build

services:
  app:
    build:
      context: .
    image: stagecrew:alpha_3.5.0
    container_name: stagecrew
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      PORT: 5173
      HOST: 0.0.0.0
      SETTINGS_FILE: /app/data/app-settings.json
      SETTINGS_DEFAULTS_FILE: /app/defaults/app-settings.json
      DATABASE_PATH: /app/data/stagecrew.sqlite
    volumes:
      - ./data:/app/data
    restart: unless-stopped
